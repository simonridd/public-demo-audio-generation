"tour","title":"Review the saved settings","instruction":"Sophie’s name, character and delivery have been saved. This walkthrough changes only its prepared example, not your actual persona library.","screen":"saved-detail","parent":"saved-persona","actions":[{"id":"return","label":"Return to the library","hotspot":{"x":22.01388888888889,"y":93.56392045454545,"width":5.374348958333333,"height":3.6363636363636362},"kind":"navigate","to":"saved-persona"}]}]}</script><script>var GuidedWalkthrough = (function(exports) {
  "use strict";
  class LiveCall {
    constructor(origin) {
      this.origin = origin;
      this.element.className = "live-call";
      this.element.innerHTML = `<details><summary>Try this demo on your phone</summary><p>Enter your own UK mobile number and the access code supplied by the presenter. Twilio will call you; audio buttons will then play down that call. Calls end after four minutes.</p><form><label>Your UK mobile number<input name="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="+44…" required></label><label>Access code<input name="pin" type="password" inputmode="numeric" autocomplete="off" required></label><label class="own-number"><input name="own" type="checkbox" required> This is my mobile number and I want to receive the demo call.</label><button class="primary" type="submit">Call my mobile</button></form><div class="live-controls" hidden><button class="secondary" data-live="stop">Stop audio</button><button class="secondary" data-live="mic">Speak live as Ben</button><button class="secondary" data-live="delegate">Delegate Ben’s audio</button><button class="secondary" data-live="end">End call</button></div><p class="live-status" role="status" aria-live="polite">Without a call, this walkthrough plays recordings on your device.</p></details>`;
      const form = this.element.querySelector("form");
      form.onsubmit = (event) => {
        event.preventDefault();
        if (this.starting || this.active) return;
        const values = new FormData(form), pin = String(values.get("pin"));
        form.elements.namedItem("pin").value = "";
        this.starting = true;
        this.message("Calling your mobile…");
        this.refresh();
        void this.request("start", { pin, to: String(values.get("mobile")).replace(/[\s()-]/g, ""), ownNumber: values.get("own") === "on" }).then((result) => {
          if (!result.token) throw new Error("Call session missing.");
          this.token = result.token;
          this.state = result;
          this.polling = setInterval(() => void this.poll(), 700);
          this.refresh();
        }).catch((e) => this.message(e.message)).finally(() => {
          this.starting = false;
          this.refresh();
        });
      };
      this.element.querySelectorAll("[data-live]").forEach((button) => button.onclick = () => {
        const action = button.dataset.live;
        void (action === "stop" ? this.stop() : action === "mic" ? this.takeover() : action === "delegate" ? this.delegate() : this.end()).catch((e) => this.message(e.message));

      if (live) root2.querySelector(".disclosure").after(live.element);
      root2.querySelector("#restart").onclick = restart;
      root2.querySelector("#home").onclick = (event) => {
        event.preventDefault();
        restart();
      };
      root2.querySelector("#back").onclick = () => {
        const previous = history.pop();
        if (previous) navigate(previous, false);
      };
      root2.querySelector("#next").onclick = () => {
        if (next && done() && !busy) navigate(next);
      };
      root2.querySelectorAll("[data-chapter]").forEach((button) => button.onclick = () => {
        const first = data.path.find((id) => steps.get(id).chapter === button.dataset.chapter);
        if (first) navigate(first);
      });
      root2.querySelectorAll("[data-action]").forEach((button) => button.onclick = () => {
        const action = s.actions.find((a) => a.id === button.dataset.action);
        if (action) void act(action);
      });
      root2.querySelectorAll("[data-result-play]").forEach((button) => button.onclick = () => {
        const result = results.get(`${s.id}/${button.dataset.resultPlay}`);
        if (result) void play(result.wav, "Stitched audio from the embedded example clips");
      });
      root2.querySelectorAll("[data-gap]").forEach((input) => input.oninput = () => {
        const action = s.actions.find((a) => a.id === input.closest("[data-gap-action]")?.dataset.gapAction);
        if (action?.kind !== "stitch") return;
        const options = gapDrafts.get(key(s, action)) ?? { minGap: action.minGap, maxGap: action.maxGap, holdSeconds: action.holdSeconds };
        options[input.dataset.gap] = input.value.trim() ? Number(input.value) : NaN;
        gapDrafts.set(key(s, action), options);
        const result = results.get(key(s, action));
        if (result) {
          stop();
          root2.querySelector("#media-host").hidden = true;
          URL.revokeObjectURL(result.wav);
          URL.revokeObjectURL(result.report);
          results.delete(key(s, action));
          complete.delete(key(s, action));
          root2.querySelector(`[data-result-action="${action.id}"]`)?.remove();
          status = "Settings changed. Create a new stitched WAV.";
          update();
        }
      });
      root2.querySelector("#zoom").onclick = (event) => {
        const button = event.currentTarget;
        const enlarged = root2.querySelector(".screen-scroll").classList.toggle("enlarged");
        button.setAttribute("aria-pressed", String(enlarged));
        button.textContent = enlarged ? "Fit screen" : "Enlarge screen";
      };
      const screen = root2.querySelector(".screen");
      screen.onclick = (event) => {
        if (!event.target.closest("button")) {
          status = "Use a highlighted control to follow this prepared walkthrough.";
          update();
        }
      };
      update();
    }
    render();
    const unload = () => {
      live?.destroy();
      stop();
      for (const url of audioUrls.values()) URL.revokeObjectURL(url);
      for (const result of results.values()) {
        URL.revokeObjectURL(result.wav);
        URL.revokeObjectURL(result.report);
      }
    };
    const pagehide = (event) => {
      if (event.persisted) stop();
      else unload();
    };
    window.addEventListener("pagehide", pagehide);
    return { destroy: () => {
      unload();
      window.removeEventListener("pagehide", pagehide);
      root2.replaceChildren();
    } };
  }
  const root = document.getElementById("walkthrough");
  if (root) {
    try {
      mountWalkthrough(root, JSON.parse(document.getElementById("walkthrough-data").textContent));
    } catch {
      root.textContent = "The walkthrough definition could not be loaded. Rebuild the standalone file from its source definition.";
    }
  }
  exports.mountWalkthrough = mountWalkthrough;
  Object.defineProperty(exports, Symbol.toStringTag, { value: "Module" });
  return exports;
})({});
</script></body></html>
