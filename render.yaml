services:
  - type: web
    name: ben-maya-call-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO_ORIGIN
        value: https://simonridd.github.io
      - key: PUBLIC_DEMO_CALL_LIMITS
        value: "0"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_DEMO_PIN
        sync: false
